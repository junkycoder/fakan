<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>fakan.cz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="canvas" id="canvas" tabindex="0" aria-label="Mindmapa fakan.cz">
    <div class="canvas__viewport" id="viewport">
      <pre class="map" id="map" aria-hidden="true"></pre>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="hits" id="hits"></div>
    </div>
  </main>

  <nav class="nav" id="nav" aria-label="Navigace">
    <div class="nav__source" data-nav-source tabindex="0">
      <button class="nav__source-btn" type="button" aria-label="Zdroj dat" data-source-btn>
        <span data-source-label>Zdroj</span>
        <span class="nav__source-caret" aria-hidden="true">▾</span>
      </button>
      <div class="nav__source-dropdown" data-source-menu aria-label="Akce zdroje"></div>
    </div>
    <span class="nav__sep" aria-hidden="true"></span>
    <div class="nav__home" data-nav-home tabindex="0">
      <button class="nav__home-btn" type="button" aria-label="Skok na hlavní strom" data-home-btn>~/</button>
      <div class="nav__dropdown" id="nav-dropdown" aria-label="Historie navštívených složek"></div>
    </div>
    <span class="nav__sep" aria-hidden="true"></span>
    <div class="nav__tabs" id="nav-tabs"></div>
  </nav>

  <div class="panels" id="panels" aria-live="polite"></div>

  <div class="empty-state" id="empty-state" data-empty-state>
    <div class="empty-state__inner" data-empty-hint></div>
  </div>

  <div class="badge" id="badge" data-badge hidden></div>

  <script src="main.js" type="module"></script>
</body>
</html>
