<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <base href="/" />
  <title>fakan.cz</title>
  <!-- Výchozí zdroj pro čerstvého návštěvníka (žádný state v IDB).
       Formát: github:owner/repo[@branch]. Per-doména konfigurace —
       překryjte v deploy-specific index.html (nebo přes <meta> injected
       z functions/_middleware.js, pokud chcete úplně dynamicky). -->
  <meta name="fakan-default-source" content="github:junkycoder/fakan.cz" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="canvas" id="canvas" tabindex="0" aria-label="Mindmapa fakan.cz">
    <div class="canvas__viewport" id="viewport">
      <pre class="map" id="map" aria-hidden="true"></pre>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="hits" id="hits"></div>
    </div>
  </main>

  <div class="srcbar" id="srcbar" aria-label="Zdroj">
    <button class="srcbar__toggle" type="button" data-srcbar-toggle aria-label="Zobrazit ovládání zdroje" aria-expanded="false">
      <span class="srcbar__toggle-glyph" aria-hidden="true">⎇</span>
      <span class="srcbar__toggle-label">zdroj</span>
      <span class="srcbar__caret" aria-hidden="true">▾</span>
    </button>
    <div class="srcbar__source" data-nav-source tabindex="0">
      <button class="srcbar__source-btn" type="button" aria-label="Zdroj dat" data-source-btn>
        <span class="srcbar__source-label" data-source-label>Zdroj</span>
        <span class="srcbar__caret" aria-hidden="true">▾</span>
      </button>
      <div class="srcbar__menu" data-source-menu aria-label="Akce zdroje"></div>
    </div>
    <div class="srcbar__branch" data-nav-branch tabindex="0" hidden>
      <button class="srcbar__branch-btn" type="button" aria-label="Větev" data-branch-btn>
        <span class="srcbar__branch-glyph" aria-hidden="true">⎇</span>
        <span class="srcbar__branch-label" data-branch-label>main</span>
        <span class="srcbar__caret" aria-hidden="true">▾</span>
      </button>
      <div class="srcbar__menu srcbar__menu--branch" data-branch-menu aria-label="Větve"></div>
    </div>
    <div class="srcbar__publish" data-nav-publish hidden>
      <button class="srcbar__publish-btn" type="button" data-publish-btn aria-label="Publish">
        <span class="srcbar__publish-glyph" data-publish-glyph aria-hidden="true">↑</span>
        <span class="srcbar__publish-label" data-publish-label>Publish</span>
      </button>
    </div>
  </div>

  <nav class="nav" id="nav" aria-label="Navigace">
    <div class="nav__home" data-nav-home tabindex="0">
      <button class="nav__home-btn" type="button" aria-label="Skok na hlavní strom" data-home-btn>~/</button>
      <div class="nav__dropdown" id="nav-dropdown" aria-label="Historie navštívených složek"></div>
    </div>
    <span class="nav__sep" aria-hidden="true"></span>
    <div class="nav__tabs" id="nav-tabs"></div>
  </nav>

  <div class="panels" id="panels" aria-live="polite"></div>

  <div class="empty-state" id="empty-state" data-empty-state>
    <div class="empty-state__inner" data-empty-hint></div>
  </div>

  <div class="src-loader" id="src-loader" data-src-loader hidden aria-live="polite" aria-busy="true">
    <div class="src-loader__inner">
      <div class="src-loader__bar" aria-hidden="true"></div>
      <div class="src-loader__label" data-src-loader-label>Otevírám zdroj…</div>
      <div class="src-loader__status" data-src-loader-status></div>
    </div>
  </div>

  <div class="badge" id="badge" data-badge hidden></div>

  <script src="vendor/qrcode.min.js"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
