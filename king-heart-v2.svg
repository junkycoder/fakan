<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Srdce -->
  <path d="M100 150 Q50 50, 10 100 Q90 180, 100 100 Q110 180, 190 100 Q150 50, 100 150"
        fill="red" stroke="black" stroke-width="2"/>

  <!-- Hrad/Koruna -->
  <path d="M50 85 L70 55 L90 85 L110 55 L130 85 L150 55 L170 85"
        fill="gold" stroke="black" stroke-width="1"/>
  <path d="M50 85 L170 85 L170 100 L50 100 Z" fill="gold" stroke="black" stroke-width="1"/>
  <!-- Rubíny -->
  <circle cx="70" cy="55" r="4" fill="red"/>
  <circle cx="110" cy="55" r="4" fill="red"/>
  <circle cx="150" cy="55" r="4" fill="red"/>

  <!-- Text H+H -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="20" fill="black"
        text-anchor="middle" dominant-baseline="middle">H+H</text>
</svg>
